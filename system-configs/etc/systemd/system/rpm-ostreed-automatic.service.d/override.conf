[Unit]
Wants=network-online.target
After=network-online.target

ConditionACPower=true

[Service]
Type=oneshot
RemainAfterExit=yes
# Reduz a prioridade do processo para não causar travamentos enquanto atualiza
Nice=19
CPUSchedulingPolicy=idle
IOSchedulingClass=idle


# Limita recursos para não impactar o sistema
MemoryMax=512M
CPUQuota=50%
