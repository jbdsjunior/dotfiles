# Browser flags configuration - systemd-tmpfiles for user space
# Creates symlinks from read-only image config to user's Flatpak config directories

L+ %h/.var/app/com.brave.Browser/config/brave-flags.conf - - - - %h/.config/brave-flags.conf
L+ %h/.var/app/com.google.Chrome/config/chrome-flags.conf - - - - %h/.config/chrome-flags.conf
